x-ledgerly-e2e-back-environment: &ledgerly-e2e-back-environment
  NODE_ENV: production
  PORT: '3000'
  FRONTEND_URL: ${E2E_APP_ORIGIN:-https://localhost}
  BACKEND_PUBLIC_URL: ${E2E_APP_ORIGIN:-https://localhost}
  COOKIE_SECURE: 'true'
  TRUST_PROXY: 'true'
  DB_HOST: postgres
  DB_PORT: '5432'
  DB_NAME: ${E2E_DB_NAME:?}
  DB_USER: ${E2E_DB_USER:?}
  DB_PASSWORD: ${E2E_DB_PASSWORD:?}
  DB_TYPEORM_POOL_MAX: '1'
  DB_AUTH_POOL_MAX: '1'
  DB_MIGRATOR_POOL_MAX: '1'
  DB_IDLE_TIMEOUT_MS: '1000'
  DB_CONNECTION_TIMEOUT_MS: '5000'
  DB_STATEMENT_TIMEOUT_MS: '30000'
  DB_QUERY_TIMEOUT_MS: '30000'
  DB_CONNECTION_BUDGET: '8'
  BETTER_AUTH_SECRET: ${E2E_AUTH_SECRET:?}
  GOOGLE_CLIENT_ID: ${E2E_GOOGLE_CLIENT_ID:?}
  GOOGLE_CLIENT_SECRET: ${E2E_GOOGLE_CLIENT_SECRET:?}
  BOOTSTRAP_ADMIN_EMAIL: ${E2E_BOOTSTRAP_ADMIN_EMAIL:?}
  STORED_FILE_ACTIVE_KEY_VERSION: v1
  STORED_FILE_KEYS: ${E2E_STORED_FILE_KEYS:?}
  CLAMAV_ENABLED: 'true'
  CLAMAV_HOST: clamav
  CLAMAV_PORT: '3310'
  CLAMAV_TIMEOUT_MS: '30000'

services:
  postgres:
    image: postgres:18-alpine@sha256:6c538e7206ea40ff740ef27883529390a690b6ead6ba96b44c67a9f7c638e8fd
    restart: 'no'
    shm_size: 128m
    environment:
      POSTGRES_USER: ${E2E_DB_USER:?}
      POSTGRES_PASSWORD: ${E2E_DB_PASSWORD:?}
      POSTGRES_DB: ${E2E_DB_NAME:?}
    ports:
      - '127.0.0.1:${E2E_DB_PUBLISHED_PORT:?}:5432'
    networks:
      - default
      - host-access
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 2s
      timeout: 3s
      retries: 30
    labels:
      com.ledgerly.e2e.owner: isolated-stack
      com.ledgerly.e2e.project: ${E2E_PROJECT_NAME:?}

  clamav:
    image: node:22.23.4-alpine@sha256:fe4f6d74e20370acb04ad889077d14d0f64a9c8ea6a42bc60cddf1e844699914
    profiles:
      - malware
    restart: 'no'
    init: true
    read_only: true
    entrypoint: ['node', '/fixture/clamd-fixture.mjs']
    volumes:
      - type: bind
        source: ./e2e/clamd-fixture.mjs
        target: /fixture/clamd-fixture.mjs
        read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=8m
    networks:
      - default
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ['CMD', 'node', '/fixture/clamd-fixture.mjs', '--healthcheck']
      interval: 2s
      timeout: 3s
      retries: 30
    labels:
      com.ledgerly.e2e.owner: isolated-stack
      com.ledgerly.e2e.project: ${E2E_PROJECT_NAME:?}

  back:
    image: ${LEDGERLY_E2E_BACK_IMAGE:-ledgerly-e2e-back:missing}
    pull_policy: never
    profiles:
      - application
    restart: 'no'
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    environment: *ledgerly-e2e-back-environment
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - default
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/api/health/ready >/dev/null || exit 1']
      interval: 2s
      timeout: 3s
      start_period: 5s
      retries: 30
    security_opt:
      - no-new-privileges:true
    labels:
      com.ledgerly.e2e.owner: isolated-stack
      com.ledgerly.e2e.project: ${E2E_PROJECT_NAME:?}

  front:
    image: ${LEDGERLY_E2E_FRONT_IMAGE:-ledgerly-e2e-front:missing}
    pull_policy: never
    profiles:
      - application
    restart: 'no'
    read_only: true
    networks:
      - default
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:8080/ >/dev/null']
      interval: 2s
      timeout: 3s
      retries: 30
    labels:
      com.ledgerly.e2e.owner: isolated-stack
      com.ledgerly.e2e.project: ${E2E_PROJECT_NAME:?}

  proxy:
    image: caddy:2.11-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    profiles:
      - application
    restart: 'no'
    init: true
    read_only: true
    ports:
      - '127.0.0.1:${E2E_PROXY_PUBLISHED_PORT:?}:443'
    volumes:
      - type: bind
        source: ./Caddyfile.e2e
        target: /etc/caddy/Caddyfile
        read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
      - /data:rw,noexec,nosuid,nodev,size=32m,uid=0,gid=0,mode=700
      - /config:rw,noexec,nosuid,nodev,size=8m,uid=0,gid=0,mode=700
    depends_on:
      back:
        condition: service_healthy
      front:
        condition: service_healthy
    networks:
      - default
      - host-access
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ['CMD-SHELL', 'wget --no-check-certificate -qO- https://localhost/ >/dev/null']
      interval: 2s
      timeout: 3s
      retries: 30
    labels:
      com.ledgerly.e2e.owner: isolated-stack
      com.ledgerly.e2e.project: ${E2E_PROJECT_NAME:?}

  migrator:
    image: ${LEDGERLY_E2E_BACK_IMAGE:-ledgerly-e2e-back:missing}
    pull_policy: never
    profiles:
      - application
    restart: 'no'
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m
    entrypoint: ['node', 'dist/database/migrate.js']
    command: ['--mode=auto']
    environment: *ledgerly-e2e-back-environment
    networks:
      - default
    security_opt:
      - no-new-privileges:true
    labels:
      com.ledgerly.e2e.owner: isolated-stack
      com.ledgerly.e2e.project: ${E2E_PROJECT_NAME:?}

  fixture:
    image: ${LEDGERLY_E2E_BACK_IMAGE:-ledgerly-e2e-back:missing}
    pull_policy: never
    profiles:
      - application
    restart: 'no'
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m
    entrypoint: ['node']
    environment: *ledgerly-e2e-back-environment
    volumes:
      - type: bind
        source: ../../apps/back/test/e2e
        target: /fixture
        read_only: true
      - type: bind
        source: ../scripts/verify-ledgerly-runtime.mjs
        target: /tmp/verify-ledgerly-runtime.mjs
        read_only: true
    networks:
      - default
    security_opt:
      - no-new-privileges:true
    labels:
      com.ledgerly.e2e.owner: isolated-stack
      com.ledgerly.e2e.project: ${E2E_PROJECT_NAME:?}

networks:
  default:
    internal: true
    labels:
      com.ledgerly.e2e.owner: isolated-stack
      com.ledgerly.e2e.project: ${E2E_PROJECT_NAME:?}
  host-access:
    driver: bridge
    labels:
      com.ledgerly.e2e.owner: isolated-stack
      com.ledgerly.e2e.project: ${E2E_PROJECT_NAME:?}
