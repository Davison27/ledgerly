name: ledgerly

services:
  postgres:
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    restart: unless-stopped
    stop_grace_period: 60s
    shm_size: ${DEPLOY_POSTGRES_SHM_SIZE:-128m}
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - data
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: ${DEPLOY_POSTGRES_CPUS:-1.0}
          memory: ${DEPLOY_POSTGRES_MEMORY:-512m}
          pids: ${DEPLOY_POSTGRES_PIDS_LIMIT:-256}
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  back:
    build:
      context: ..
      dockerfile: apps/back/Dockerfile
    image: ledgerly-back:local
    pull_policy: never
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      clamav:
        condition: service_healthy
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=${DEPLOY_TMPFS_SIZE:-256m}
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: ${DEPLOY_BACK_CPUS:-1.0}
          memory: ${DEPLOY_BACK_MEMORY:-768m}
          pids: ${DEPLOY_PIDS_LIMIT:-256}
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health/ready >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 6
    networks:
      - proxy
      - data
      - scanner

  clamav:
    image: clamav/clamav:1.5.3-debian@sha256:741e6c447241220e0792a901befcaec1d55a755c5097fc9cd88d7fd8be251a5c
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m
    volumes:
      - clamav_data:/var/lib/clamav
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: ${DEPLOY_CLAMAV_CPUS:-1.0}
          memory: ${DEPLOY_CLAMAV_MEMORY:-768m}
          pids: ${DEPLOY_CLAMAV_PIDS_LIMIT:-256}
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --ping 1 >/dev/null"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 6
    networks:
      - scanner

  clamav-updater:
    image: clamav/clamav:1.5.3-debian@sha256:741e6c447241220e0792a901befcaec1d55a755c5097fc9cd88d7fd8be251a5c
    profiles: [maintenance]
    restart: "no"
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=128m
    volumes:
      - clamav_data:/var/lib/clamav
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: ${DEPLOY_CLAMAV_CPUS:-1.0}
          memory: ${DEPLOY_CLAMAV_MEMORY:-768m}
          pids: ${DEPLOY_CLAMAV_PIDS_LIMIT:-256}
    logging:
      driver: local
      options:
        max-size: 5m
        max-file: "2"
    security_opt:
      - no-new-privileges:true
    command: ["freshclam", "--stdout", "--foreground"]
    networks:
      - clamav_update_egress

  front:
    build:
      context: ..
      dockerfile: apps/front/Dockerfile
    image: ledgerly-front:local
    pull_policy: never
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=${DEPLOY_FRONT_TMPFS_SIZE:-64m}
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: ${DEPLOY_FRONT_CPUS:-0.5}
          memory: ${DEPLOY_FRONT_MEMORY:-128m}
          pids: ${DEPLOY_FRONT_PIDS_LIMIT:-128}
    logging:
      driver: local
      options:
        max-size: 5m
        max-file: "3"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 5s
      retries: 6
    networks:
      - proxy

  caddy:
    image: caddy:2.11-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    deploy:
      resources:
        limits:
          pids: 128
    logging:
      driver: local
      options:
        max-size: 5m
        max-file: "3"
    security_opt:
      - no-new-privileges:true
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      LEDGERLY_DOMAIN: ${LEDGERLY_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      back:
        condition: service_healthy
      front:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate -qO- --header='Host: ${LEDGERLY_DOMAIN}' https://127.0.0.1/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 5
    networks:
      - proxy

  migrator:
    image: ledgerly-back:local
    pull_policy: never
    profiles: [tools]
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    command: ["node", "dist/database/bootstrap.js"]
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=${DEPLOY_TMPFS_SIZE:-256m}
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          pids: ${DEPLOY_MIGRATOR_PIDS_LIMIT:-128}
    logging:
      driver: local
      options:
        max-size: 5m
        max-file: "2"
    security_opt:
      - no-new-privileges:true
    networks:
      - data

volumes:
  pgdata:
  caddy_data:
  caddy_config:
  clamav_data:

networks:
  proxy:
  data:
    internal: true
  scanner:
    internal: true
  clamav_update_egress:
    internal: false
