[agents]
enabled = true
max_concurrent_threads_per_session = 4

[agents.planner]
description = "Architect who turns a request into an executable plan without editing product code."
config_file = "agents/planner.toml"

[agents."plan-validator"]
description = "Validator who checks plan feasibility against the real code."
config_file = "agents/plan-validator.toml"

[agents.implementer]
description = "Developer for one approved unit; the only role allowed to edit product code."
config_file = "agents/implementer.toml"

[agents.qa]
description = "QA role that verifies the plan, diff, and quality gates without editing."
config_file = "agents/qa.toml"
