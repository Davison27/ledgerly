services:
  postgres:
    image: postgres:17-alpine
    container_name: ledgerly-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-ledgerly}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ledgerly}
      POSTGRES_DB: ${DB_NAME:-ledgerly}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - ledgerly-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-ledgerly} -d ${DB_NAME:-ledgerly}"]
      interval: 5s
      timeout: 5s
      retries: 10

  back:
    build:
      context: ../..
      dockerfile: apps/back/Dockerfile
    env_file: .env
    environment:
      DB_HOST: postgres
      NODE_ENV: development
      PORT: 3000
    ports:
      - "${BACKEND_PORT:-3005}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    init: true
    security_opt:
      - no-new-privileges:true

  migrator:
    build:
      context: ../..
      dockerfile: apps/back/Dockerfile
    env_file: .env
    environment:
      DB_HOST: postgres
      NODE_ENV: development
    depends_on:
      postgres:
        condition: service_healthy
    command: ["node", "dist/database/bootstrap.js"]
    restart: "no"

volumes:
  ledgerly-pgdata:
