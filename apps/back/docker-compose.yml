name: ledgerly-dev

services:
  postgres:
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    container_name: ledgerly-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-ledgerly}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ledgerly}
      POSTGRES_DB: ${DB_NAME:-ledgerly}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - ledgerly-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-ledgerly} -d ${DB_NAME:-ledgerly}"]
      interval: 5s
      timeout: 5s
      retries: 10

  back:
    build:
      context: ../..
      dockerfile: apps/back/Dockerfile
    env_file: .env
    environment:
      DB_HOST: postgres
      NODE_ENV: development
      PORT: 3000
    ports:
      - "${BACKEND_PORT:-3005}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
      clamav:
        condition: service_healthy
    init: true
    security_opt:
      - no-new-privileges:true

  clamav:
    image: clamav/clamav:1.5.3-debian@sha256:741e6c447241220e0792a901befcaec1d55a755c5097fc9cd88d7fd8be251a5c
    restart: unless-stopped
    init: true
    volumes:
      - ledgerly-clamav-data:/var/lib/clamav
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --ping 1 >/dev/null"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 6

  migrator:
    build:
      context: ../..
      dockerfile: apps/back/Dockerfile
    env_file: .env
    environment:
      DB_HOST: postgres
      NODE_ENV: development
    depends_on:
      postgres:
        condition: service_healthy
    command: ["node", "dist/database/bootstrap.js"]
    restart: "no"

volumes:
  ledgerly-pgdata:
  ledgerly-clamav-data:
